name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Sprint migraciones-aisladas: producción real corre en Postgres, pero
    # toda la suite corre en SQLite, que acepta cualquier nombre de tipo
    # por afinidad de columna sin quejarse — así fue como una migración
    # con DATETIME (sintaxis SQLite/MySQL, inválida en Postgres) pasó por
    # 568 tests en verde y tumbó el arranque completo en producción.
    # Este servicio le da a tests/test_migraciones_postgres.py un
    # Postgres real contra el cual correr TODAS las migraciones.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: maestria_test
          POSTGRES_PASSWORD: maestria_test
          POSTGRES_DB: maestria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        env:
          TEST_DATABASE_URL_POSTGRES: postgresql://maestria_test:maestria_test@localhost:5432/maestria_test
        run: python -m pytest tests/ -v

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run frontend JS tests (auto-refresh de JWT — api.js/auth.js)
        working-directory: backend
        # Sprint auto-refresh-jwt-frontend: la orquestación de refresh-y-
        # reintento (dedup de refrescos concurrentes, distinguir token
        # revocado de fallo de red, etc.) es lógica async de navegador —
        # no se puede probar honestamente con pytest. Usa el test runner
        # nativo de Node (node --test), sin dependencias nuevas: no hay
        # package.json en este repo y no se le agrega uno para esto.
        run: node --test tests/js/test_*.js

      - name: Dependency vulnerability scan (pip-audit)
        working-directory: backend
        run: |
          pip install pip-audit
          # Audita los paquetes YA instalados en este entorno (los mismos
          # de requirements.txt) — evita reconstruir un venv desde cero
          # con `-r requirements.txt`, que falla en runners sin toolchain
          # de compilación para paquetes con extensión nativa. Paso
          # obligatorio: cualquier CVE nuevo (no triado abajo) corta el
          # pipeline.
          #
          # Hallazgos triados y excluidos deliberadamente, cada uno con su
          # razón — NO son "ignorados sin más", son decisiones explícitas:
          #   - PYSEC-2026-1325 (ecdsa): advisory de timing attack (Minerva)
          #     sin versión corregida publicada por el proyecto — no hay
          #     bump posible. Transitiva de python-jose[cryptography]; esta
          #     app sólo firma JWT con HS256, no usa ECDSA.
          #   - PYSEC-2026-1845 (pytest): sólo se usa en CI/dev, nunca se
          #     despliega a producción. El fix es un bump de major version
          #     (8→9) que amerita su propia validación de regresión sobre
          #     ~330+ tests, fuera de alcance — mismo criterio que el sprint
          #     de seguridad original.
          #   - PYSEC-2026-3447 (setuptools): tooling del entorno Python
          #     del runner, no es una dependencia declarada en
          #     requirements.txt.
          #
          # sprint dependencias-fastapi-starlette: las 7 de starlette
          # (PYSEC-2026-161/248/249/1943/1941/2280/2281) que estaban acá
          # ignoradas quedaron CERRADAS con el bump a fastapi==0.141.1 +
          # starlette==1.6.0 — se sacan de la lista a propósito, no por
          # olvido: si alguna reaparece (regresión de versión, o un CVE
          # nuevo con el mismo ID por error), este --strict debe cortar
          # el pipeline en vez de seguir ignorándola en silencio.
          pip-audit --strict \
            --ignore-vuln PYSEC-2026-1325 \
            --ignore-vuln PYSEC-2026-1845 \
            --ignore-vuln PYSEC-2026-3447

      - name: Dependency vulnerability scan (safety)
        working-directory: backend
        continue-on-error: true
        run: |
          pip install safety
          # `safety check` (modo legacy) no requiere API key, a diferencia
          # de `safety scan`. Se corre como señal adicional pero
          # non-blocking: safety puede requerir autenticación según la
          # versión/política vigente del servicio y no debe tumbar CI por
          # una dependencia externa fuera de nuestro control. pip-audit
          # (arriba) es el chequeo obligatorio real de este pipeline.
          safety check --full-report || true
