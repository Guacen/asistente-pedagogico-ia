name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        run: python -m pytest tests/ -v

      - name: Dependency vulnerability scan (pip-audit)
        working-directory: backend
        run: |
          pip install pip-audit
          # Audita los paquetes YA instalados en este entorno (los mismos
          # de requirements.txt) — evita reconstruir un venv desde cero
          # con `-r requirements.txt`, que falla en runners sin toolchain
          # de compilación para paquetes con extensión nativa. Paso
          # obligatorio: cualquier CVE nuevo (no triado abajo) corta el
          # pipeline.
          #
          # Hallazgos triados y excluidos deliberadamente (sprint
          # seguridad-avanzada), cada uno con su razón — NO son "ignorados
          # sin más", son decisiones explícitas:
          #   - PYSEC-2026-1325 (ecdsa): advisory de timing attack (Minerva)
          #     sin versión corregida publicada por el proyecto — no hay
          #     bump posible. Transitiva de python-jose[cryptography]; esta
          #     app sólo firma JWT con HS256, no usa ECDSA.
          #   - PYSEC-2026-1845 (pytest): sólo se usa en CI/dev, nunca se
          #     despliega a producción. El fix es un bump de major version
          #     (8→9) que amerita su propia validación de regresión sobre
          #     ~330 tests, fuera de alcance de este sprint de seguridad.
          #   - PYSEC-2026-3447 (setuptools): tooling del entorno Python
          #     del runner, no es una dependencia declarada en
          #     requirements.txt.
          #   - starlette (PYSEC-2026-161/248/249/1943/1941/2280/2281):
          #     transitiva de fastapi==0.111.0. Requiere bump de fastapi a
          #     una versión con rango de starlette compatible más nuevo —
          #     cambio de mayor alcance (afecta CORS/middleware/StaticFiles/
          #     streaming en todo el backend) que merece su propio PR con
          #     validación dedicada, no mezclado en este sprint.
          pip-audit --strict \
            --ignore-vuln PYSEC-2026-1325 \
            --ignore-vuln PYSEC-2026-1845 \
            --ignore-vuln PYSEC-2026-3447 \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-1943 \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281

      - name: Dependency vulnerability scan (safety)
        working-directory: backend
        continue-on-error: true
        run: |
          pip install safety
          # `safety check` (modo legacy) no requiere API key, a diferencia
          # de `safety scan`. Se corre como señal adicional pero
          # non-blocking: safety puede requerir autenticación según la
          # versión/política vigente del servicio y no debe tumbar CI por
          # una dependencia externa fuera de nuestro control. pip-audit
          # (arriba) es el chequeo obligatorio real de este pipeline.
          safety check --full-report || true
