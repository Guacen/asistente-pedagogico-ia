<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu prueba gratuita terminó · Maestr.ia</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0B3D2E">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Maestr.ia">
    <link rel="apple-touch-icon" href="/assets/icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css?v=20260806">
    <link rel="stylesheet" href="css/brand.css?v=20260806">

    <style>
        body { background: #F9FAFB; min-height: 100vh; }
    </style>
</head>
<body>

    <!-- Header simple -->
    <nav class="bg-white border-b border-gray-200 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <img src="assets/logo.png" alt="Maestr.ia" class="brand-logo-sm">
            </a>
            <button id="btn-logout" class="text-sm text-gray-500 hover:text-gray-800 inline-flex items-center">
                <i class="fas fa-arrow-right-from-bracket mr-2"></i>Cerrar sesión
            </button>
        </div>
    </nav>

    <main class="max-w-lg mx-auto px-4 py-16 flex flex-col items-center text-center">
        <div class="w-20 h-20 rounded-full flex items-center justify-center mb-6" style="background:#FFF7ED;">
            <i class="fas fa-hourglass-end text-3xl" style="color:#F97316;"></i>
        </div>

        <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mb-3">
            Tu prueba gratuita de 7 días ha terminado.
        </h1>
        <p class="text-gray-600 mb-10">
            Para seguir usando Maestr.ia, elige un plan.
        </p>

        <div class="w-full flex flex-col gap-3">
            <a href="precios.html"
               class="w-full py-3 rounded-lg text-white font-semibold inline-flex items-center justify-center gap-2 transition-opacity hover:opacity-90"
               style="background:#1D9E75;">
                Ver planes <i class="fas fa-arrow-right"></i>
            </a>
            <a href="https://wa.me/573239097629?text=Hola%2C%20mi%20prueba%20termin%C3%B3%20y%20quiero%20informaci%C3%B3n%20sobre%20los%20planes"
               target="_blank" rel="noopener"
               class="w-full py-3 rounded-lg font-semibold inline-flex items-center justify-center gap-2 border border-gray-300 text-gray-700 hover:bg-gray-100 transition-colors">
                <i class="fab fa-whatsapp text-lg" style="color:#25D366;"></i>Hablar con el equipo
            </a>
        </div>

        <p class="text-xs text-gray-400 mt-10">
            Tus datos siguen ahí — apenas actives un plan, todo tu trabajo (grupos, PIARs, notas) sigue disponible.
        </p>
    </main>

    <script src="js/config.js?v=20260806"></script>
    <script src="js/api.js?v=20260806"></script>
    <script src="js/auth.js?v=20260806"></script>
    <script>
        requireAuth();
        document.getElementById('btn-logout').addEventListener('click', () => {
            api.removeToken();
            localStorage.clear();
            window.location.replace('login.html');
        });
    </script>
</body>
</html>
