<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña · Maestr.ia</title>
    <link rel="icon" type="image/png" href="assets/icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css?v=20260803">
    <link rel="stylesheet" href="css/brand.css?v=20260803">
</head>
<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full">
        <div class="bg-white rounded-2xl shadow-2xl p-8 text-center">

            <img src="assets/logo.png" alt="Maestr.ia" class="mx-auto mb-4 brand-logo-lg">

            <!-- Estado: formulario -->
            <div id="estado-form" class="py-2 text-left">
                <h1 class="text-2xl font-bold text-gray-900 mb-3 text-center">¿Olvidaste tu contraseña?</h1>
                <p class="text-gray-600 mb-6 text-center">
                    Ingresá tu correo y te enviamos un enlace para elegir una nueva.
                </p>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Correo</label>
                <input
                    type="email"
                    id="email"
                    placeholder="tu@correo.com"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg mb-4 focus:ring-2 focus:ring-green-500 focus:border-transparent"
                >
                <button
                    id="btn-enviar"
                    class="w-full py-3 rounded-lg font-semibold text-white transition-colors"
                    style="background:#1D9E75"
                >
                    Enviar enlace de recuperación
                </button>
                <p id="form-msg" class="text-xs mt-3 hidden"></p>
            </div>

            <!-- Estado: enlace enviado -->
            <div id="estado-enviado" class="hidden py-4">
                <div class="mx-auto mb-4 w-16 h-16 rounded-full flex items-center justify-center" style="background:#E1F5EE">
                    <i class="fas fa-envelope-open-text text-3xl" style="color:#1D9E75"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-900 mb-3">Revisa tu correo</h1>
                <p class="text-gray-600 mb-4">
                    Si <strong id="email-destino" class="text-gray-900"></strong> está registrado, te enviamos un enlace para restablecer tu contraseña. Es válido por 1 hora.
                </p>
                <a
                    href="login.html"
                    class="inline-block w-full py-3 rounded-lg font-semibold text-white"
                    style="background:#1D9E75"
                >
                    Volver a iniciar sesión
                </a>
            </div>
        </div>

        <div class="mt-6 text-center">
            <a href="login.html" class="text-gray-600 hover:text-gray-900 inline-flex items-center">
                <i class="fas fa-arrow-left mr-2"></i>
                Volver a iniciar sesión
            </a>
        </div>
    </div>

    <script src="js/config.js?v=20260803"></script>
    <script src="js/api.js?v=20260803"></script>

    <script>
        const btn = document.getElementById('btn-enviar');
        const emailInput = document.getElementById('email');
        const msg = document.getElementById('form-msg');

        btn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            if (!email) {
                msg.textContent = 'Ingresá tu correo.';
                msg.className = 'text-xs mt-3 text-red-600';
                msg.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            const original = btn.textContent;
            btn.textContent = 'Enviando...';

            try {
                await api.forgotPassword(email);
            } catch (e) {
                // El backend nunca revela si el email existe — cualquier
                // error de red se muestra igual como "revisa tu correo"
                // para no filtrar información por timing/estado.
            }

            document.getElementById('email-destino').textContent = email;
            document.getElementById('estado-form').classList.add('hidden');
            document.getElementById('estado-enviado').classList.remove('hidden');

            btn.disabled = false;
            btn.textContent = original;
        });

        emailInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') btn.click();
        });
    </script>
</body>
</html>
