<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Maestr.ia">
  <!-- Fondo transparente. Aprox del logo: libro abierto con árbol de conocimiento + rayos ámbar. -->
  <defs>
    <style>
      .st-dark  { stroke: #0B3D2E; }
      .st-green { stroke: #1D9E75; }
      .fi-book  { fill: #2ECC71; }
      .fi-amber { fill: #F5B731; }
    </style>
  </defs>

  <!-- Libro: lomo central + dos páginas -->
  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="st-dark">
    <!-- página izquierda (blanca con líneas) -->
    <path d="M22 62 Q22 58 26 58 L60 58 L60 102 L26 102 Q22 102 22 98 Z" fill="#FFFFFF"/>
    <!-- líneas de texto -->
    <line x1="30" y1="70" x2="54" y2="70" stroke-width="3"/>
    <line x1="30" y1="78" x2="50" y2="78" stroke-width="3"/>
    <line x1="30" y1="86" x2="54" y2="86" stroke-width="3"/>
    <!-- página derecha (verde llena) -->
    <path d="M64 58 L98 58 Q102 58 102 62 L102 98 Q102 102 98 102 L64 102 Z" class="fi-book"/>
    <!-- lomo -->
    <line x1="62" y1="58" x2="62" y2="102" stroke-width="4"/>
  </g>

  <!-- Árbol de conocimiento (circuitos): tronco recto + dos ramas -->
  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="st-green">
    <line x1="62" y1="55" x2="62" y2="30"/>
    <line x1="62" y1="42" x2="46" y2="30"/>
    <line x1="62" y1="42" x2="78" y2="30"/>
    <!-- nodos en las puntas -->
    <circle cx="46" cy="30" r="4" fill="#1D9E75" stroke="none"/>
    <circle cx="78" cy="30" r="4" fill="#1D9E75" stroke="none"/>
  </g>

  <!-- Sol/destellos ámbar arriba -->
  <circle cx="62" cy="20" r="6" class="fi-amber"/>
  <g stroke="#F5B731" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="62" y1="6"  x2="62" y2="10"/>
    <line x1="50" y1="12" x2="53" y2="16"/>
    <line x1="74" y1="12" x2="71" y2="16"/>
  </g>
</svg>
